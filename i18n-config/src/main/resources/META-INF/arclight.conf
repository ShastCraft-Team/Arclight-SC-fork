_v = 1

locale {
  # Запасной язык для ключей, которых нет в locale.current. Английский, а не zh_cn:
  # переводы апстрима неполные, и на не-китайском сервере конфиг иначе выходит
  # почти целиком на иероглифах.
  fallback = "en_us"
}
optimization {
  cache-plugin-class = true
  disable-data-fixer = false
  goal-selector-update-interval = 2
  use-activation-and-tracking-range = true
  disable-block-physics-event = false
  max-entities-per-chunk {
    default = -1
  }
  chunk-load-entity-cull = false
  ping-cache-seconds = 0
  tick-armor-stands = true
  async-scheduler-max-threads = -1
  spawn-census-interval = 4
  # кеш BlockEntityType.isValid: экономит тик, но замораживает ответ мода,
  # если тот инжектится в isValid с зависимостью от позиции. По умолчанию выключен.
  cache-block-entity-valid = false
  lag-compensation {
    block-breaking = true
    max-catchup-ticks = 4
    movement = true
    movement-stall-threshold-ms = 200
  }
  dab {
    enabled = true
    start-distance = 12
    activation-dist-mod = 8
    max-tick-freq = 20
  }
}
compatibility {
  material-property-overrides {
  }
  entity-property-overrides {
  }
  symlink-world = false
  extra-logic-worlds = [
    "com.example.mod.ExtraLogicWorld",
    "xyz.nucleoid.fantasy.RuntimeWorld"
  ]
  forward-permission = true
  valid-username-regex = ""
  lenient-item-tag-match = true
  isolate-plugin-class-loaders = [
    "com.example.mod.package.aaaa"
  ]
  isolate-adventure-from-modloader = false
  keepalive-lag-grace = true
  keepalive-timeout-seconds = 15
  mod-entity-block-change-events = true
  fake-player-block-events = true
}
async-catcher {
  dump = true
  warn = true
  defaultOperation = block
  overrides {
  }
}