comments {
  _v.comment = [
    "Repository: https://github.com/IzzelAliz/Arclight"
    "Issue Tracker: https://github.com/IzzelAliz/Arclight/issues"
    ""
    ""
    "Config version number, do not edit."
  ]
  locale.comment = "Language/I18n settings"
  optimization {
    comment = "Optimization related settings"
    goal-selector-update-interval.comment = [
      "Interval in ticks to update the goal selector"
      "Higher values costs less resources"
      "Cause mobs changing their goals less often"
    ]
    use-activation-and-tracking-range.comment = "Whether to use Spigot Activation Range and Tracking Range optimization"
    dab {
      comment = [
        "DAB - distance based AI throttling: entity AI runs less often the further it is from players"
        "Mobs near players are NEVER throttled, so combat and nearby farms behave like vanilla"
        "Throttles goal selectors AND brains (villagers, piglins, warden) - the main win on entity"
        "heavy servers. goal-selector-update-interval still acts as a global floor"
      ]
      enabled.comment = "Enable distance based AI throttling"
      start-distance.comment = [
        "Distance in blocks from the nearest player where throttling begins"
        "Mobs closer than this always tick their AI at full speed"
      ]
      activation-dist-mod.comment = [
        "How aggressively the tick interval grows with distance (bit shift on squared distance)"
        "Lower values throttle harder and sooner, higher values are gentler"
      ]
      max-tick-freq.comment = [
        "Upper limit for the AI tick interval, in ticks"
        "20 means the most distant mobs re-plan their AI once per second"
      ]
    }
    max-entities-per-chunk.comment = [
      "Per chunk limit of entities of the same type; spawns above the cap are blocked"
      "Key is an entity id like \"minecraft:zombie\", or \"default\" for every other type; -1 = unlimited"
      "Example: { default = -1, \"minecraft:zombie\" = 40, \"minecraft:item\" = 100 }"
      "Players are never limited, plugin (CUSTOM) and command spawns are exempt"
    ]
    ping-cache-seconds.comment = [
      "Cache the server list ping response for N seconds; 0 = disabled (vanilla behavior)"
      "Reduces network thread load on busy servers, but ServerListPingEvent then fires"
      "at most once per interval - per-client MOTD plugins will not see every ping"
    ]
    disable-block-physics-event.comment = [
      "Hard-disables BlockPhysicsEvent entirely"
      "When no plugin listens for it the event is skipped automatically anyway,"
      "so only enable this if a plugin listens but you do not need the event"
    ]
    tick-armor-stands.comment = [
      "false stops armor stands from ticking: they no longer fall or burn,"
      "but equipping, breaking and interaction still work"
      "Big win on servers with lots of decorative stands and map art"
    ]
    chunk-load-entity-cull.comment = [
      "On chunk load, removes entities above 2x their max-entities-per-chunk cap"
      "Never touches named, tamed or persistence-required entities"
      "Cleans up farms that accumulated before the cap was introduced; off by default"
    ]
    spawn-census-interval.comment = [
      "How often the mob census used for spawn caps is recomputed, in ticks"
      "Vanilla does it every tick: walks every entity in the world, reading chunk and biome"
      "Mob density does not change in 50ms, so 4 ticks (200ms) is safe"
      "Counts only grow between censuses, so over-spawning cannot happen"
    ]
    lag-compensation {
      comment = [
        "Lag compensation - does not speed the server up, but stops the game from feeling"
        "broken when a tick exceeds 50ms. The client shows progress in real time while the"
        "server counts it in ticks, which is why everything feels sluggish at low TPS"
      ]
      block-breaking.comment = [
        "Block breaking and attack cooldown follow real time instead of ticks"
        "At 85ms MSPT a block breaks in the same wall-clock time as at 20 TPS"
      ]
      max-catchup-ticks.comment = [
        "Safety cap on how many ticks may be caught up at once"
        "Prevents a burst of progress right after a long freeze"
      ]
      movement.comment = [
        "Do not rubber-band players when the position desync was caused by a server stall"
        "The vanilla check reads queued movement packets as cheating and teleports them back"
      ]
      movement-stall-threshold-ms.comment = [
        "Tick delay from which the server, not the player, is considered at fault (ms)"
      ]
    }
    async-scheduler-max-threads.comment = [
      "Maximum threads for the Bukkit async scheduler pool"
      "Vanilla CraftBukkit spawns one thread per concurrent async task (unbounded);"
      "plugins scheduling a task per chunk can explode this to 100k+ threads"
      "-1 - auto: 2x CPU cores, clamped to 4..16"
    ]
    cache-block-entity-valid.comment = [
      "Cache the result of BlockEntityType.isValid per ticking block entity"
      "Saves a few percent of tick time, but assumes isValid is a pure function of"
      "(type, block state). A mod injecting position or NBT dependent logic into it"
      "would get a frozen answer, so this is off by default - enable under load"
    ]
  }
  async-catcher.comment = [
    "Async Catcher related settings"
    "There are four modes, and BLOCK is recommended"
    "NONE - Do nothing"
    "DISPATCH - Non blocking-ly dispatch action to main thread"
    "BLOCK - Run in main thread and wait for results"
    "EXCEPTION - Raise an error"
  ]
  async-catcher.dump.comment = "Dump stack trace information in debug.log"
  compatibility {
    symlink-world.comment = [
      "Create symbol links to mod dimension folder that matches Bukkit world name"
      "Enable this could improve plugin compatibility"
      "Changing this on production server will cause changes to mod world names"
      "  and cause data loss on plugins relying world names"
      "See https://github.com/IzzelAliz/Arclight/wiki/World-Symlink for more detail"
    ]
    extra-logic-worlds.comment = [
      "Extra worlds running logic"
      "If any mods do not function well, try search class names in logs related to [EXT_LOGIC] and add them here"
    ]
    forward-permission.comment = [
      "true - Forward Forge permission query to Bukkit"
      "false - Disable permission forward"
      "reverse - Forward Bukkit player permission query to Forge"
    ]
    valid-username-regex.comment = [
      "Regex for valid username check. Leave it blank will fallback to vanilla check"
      "Following allows Chinese characters:"
      "valid-username-regex = \"^[ -~\\\\p{sc=Han}]{1,16}$\""
      "Following allows any username to login:"
      "valid-username-regex = \".+\""
    ]
    lenient-item-tag-match.comment = [
      "Allows items with an empty nbt tag stack on no tag items"
    ]
    isolate-plugin-class-loaders.comment = [
      "An illegal access means that a plugin loads a class from another plugin that is not a depend or soft-depend of itself"
      "When a package name is given, no illegal access will be attempted on classes prefixed with the package name."
      "This is especially useful when class loading issues happen."
      "Beware that it may break plugins relying on illegal access."
    ]
    isolate-adventure-from-modloader.comment = [
      "Prevent plugins from loading Kyori Adventure from ModLoader."
      "This is only an compatibility option and persists for now. Will be replaced with a better mechanism."
    ]
    mod-entity-block-change-events.comment = [
      "Fire a cancellable EntityChangeBlockEvent when a MODDED entity changes blocks during its tick"
      "Lets region plugins (WorldGuard) protect claims from Create contraption drills, harvesters etc."
      "Near zero cost when no plugin listens. Stationary machines (pure block entities) are not covered"
    ]
    fake-player-block-events.comment = [
      "false exempts mod fake players (e.g. Create deployers) from BlockBreak/BlockPlace events:"
      "machines work inside claims, but region protection no longer applies to their actions"
      "Alternative: keep true and add the fake player to the region, e.g. /rg addmember <region> [Deployer]"
    ]
    keepalive-lag-grace.comment = [
      "Do not kick players for the server's own stalls"
      "Keep-alive replies are handled on the main thread: while it is stuck the packet sits"
      "in the queue and vanilla drops the connection even though the player's link is fine"
      "The deadline is extended by exactly the stalled time; dead clients still time out"
    ]
    keepalive-timeout-seconds.comment = [
      "Base keep-alive timeout in seconds (vanilla is 15)"
    ]
  }
}
