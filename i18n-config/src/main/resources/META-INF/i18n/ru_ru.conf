 comments {
  _v.comment = [
    "Репозиторий: https://github.com/IzzelAliz/Arclight"
    "Баг-трекер: https://github.com/IzzelAliz/Arclight/issues"
    ""
    ""
    "Версия конфигурации, не исправляйте."
  ]
  locale.comment = "Язык/настройки I18n"
  optimization {
    comment = "Настройки серверных оптимизаций"
    goal-selector-update-interval.comment = [
      "Интервал обновления селектора целей мобов, в тиках"
      "Больше значение - меньше расход ресурсов, но мобы реже меняют цели"
      "Действует глобально (в том числе на мобов рядом с игроками), поэтому обычно"
      "поднимать его не нужно: этим занимается dab по дистанции"
    ]
    use-activation-and-tracking-range.comment = "Использовать оптимизации Spigot Activation Range и Tracking Range"
    dab {
      comment = [
        "DAB - троттлинг AI по дистанции: чем дальше моб от игроков, тем реже он пересчитывает AI"
        "Мобы рядом с игроками НЕ троттлятся - бой и ближние фермы работают как в ванили"
        "Работает и для goal-селекторов, и для brain-мобов (жители, пиглины, варден) - это главный"
        "выигрыш на серверах с фермами. goal-selector-update-interval остаётся глобальным полом"
      ]
      enabled.comment = "Включить троттлинг AI по дистанции"
      start-distance.comment = [
        "Дистанция в блоках до ближайшего игрока, с которой начинается троттлинг"
        "Мобы ближе этого расстояния всегда думают на полной скорости"
      ]
      activation-dist-mod.comment = [
        "Насколько быстро растёт интервал тика с дистанцией (битовый сдвиг квадрата расстояния)"
        "Меньше значение - троттлит сильнее и раньше, больше - мягче"
      ]
      max-tick-freq.comment = [
        "Верхний предел интервала тика AI, в тиках"
        "20 означает, что самые дальние мобы пересчитывают AI раз в секунду"
      ]
    }
    max-entities-per-chunk.comment = [
      "Лимит сущностей одного типа на чанк; спавн сверх лимита блокируется"
      "Ключ - id сущности вида \"minecraft:zombie\", либо \"default\" для всех остальных; -1 = без лимита"
      "Пример: { default = -1, \"minecraft:zombie\" = 40, \"minecraft:item\" = 100 }"
      "Игроки не ограничиваются никогда, спавн из плагинов (CUSTOM) и команд не учитывается"
    ]
    ping-cache-seconds.comment = [
      "Кешировать ответ на пинг списка серверов на N секунд; 0 = выключено (как в ванили)"
      "Разгружает сетевые потоки на людном сервере, но ServerListPingEvent вызывается"
      "не чаще раза за интервал - MOTD-плагины с пер-клиентской логикой увидят не каждый пинг"
    ]
    disable-block-physics-event.comment = [
      "Полностью отключает BlockPhysicsEvent"
      "Если событие никто не слушает - оно и так пропускается автоматически,"
      "включайте только если плагин слушает его, а событие вам не нужно"
    ]
    tick-armor-stands.comment = [
      "false отключает тик броневых стоек: они перестают падать и гореть,"
      "но экипировка, ломание и взаимодействие работают"
      "Большой выигрыш на серверах с декоративными стойками и карт-артами"
    ]
    chunk-load-entity-cull.comment = [
      "При загрузке чанка удаляет сущностей сверх 2x лимита max-entities-per-chunk"
      "Никогда не трогает именных, прирученных и persistence-сущностей"
      "Чистит фермы, накопленные до введения лимита; по умолчанию выключено"
    ]
    spawn-census-interval.comment = [
      "Как часто пересчитывать перепись мобов для лимитов спавна, в тиках"
      "Ваниль делает это каждый тик: обход всех сущностей мира с чтением чанка и биома"
      "Плотность мобов за 50 мс не меняется, 4 тика (200 мс) безопасны"
      "Между переписями счётчики только растут, поэтому переспавна быть не может"
    ]
    lag-compensation {
      comment = [
        "Компенсация лага - не ускоряет сервер, но убирает у игрока ощущение поломки,"
        "когда тик не укладывается в 50 мс. Клиент рисует прогресс в реальном времени,"
        "а сервер считает его в тиках - из-за этого при низком TPS всё кажется вязким"
      ]
      block-breaking.comment = [
        "Ломание блоков и кулдаун удара идут по реальному времени, а не по тикам"
        "При MSPT 85 блок ломается за то же время, что и при 20 TPS"
      ]
      max-catchup-ticks.comment = [
        "Предохранитель: сколько тиков максимум досчитывается за один раз"
        "Не даёт после длинного фриза сломать всё разом или выдать пачку зарядов удара"
      ]
      movement.comment = [
        "Не откатывать игрока назад, если рассинхрон позиции возник из-за стойки сервера"
        "Ванильная проверка считает накопленные пакеты движения читом и телепортирует назад"
      ]
      movement-stall-threshold-ms.comment = [
        "С какой задержки тика считать, что виноват сервер, а не игрок (в миллисекундах)"
      ]
    }
    async-scheduler-max-threads.comment = [
      "Максимум потоков async-планировщика Bukkit"
      "Ванильный CraftBukkit создаёт поток на каждую параллельную async-задачу (без лимита);"
      "плагины с задачей на каждый чанк раздувают это до 100k+ потоков и роняют сервер"
      "-1 - авто: 2x ядер CPU, в пределах 4..16"
    ]
    cache-block-entity-valid.comment = [
      "Кешировать результат BlockEntityType.isValid для каждого тикающего блок-энтити"
      "Экономит несколько процентов тика, но исходит из того, что isValid — чистая функция"
      "от (тип, состояние блока). Мод, инжектящий туда зависимость от позиции или NBT,"
      "получит замороженный ответ, поэтому по умолчанию выключено — включать под нагрузкой"
    ]
  }
  async-catcher.comment = [
    «Настройки Async Catcher»
    «Есть четыре режима, BLOCK наиболее предпочтителен»
    «NONE - Ничего не предпринимать»
    «DISPATCH - Действовать в основном потоке без его блокировки»
    «BLOCK - Перехватывать основной поток и ожидать результат»
    «EXCEPTION - Выдавать исключение»
  ]
  async-catcher.dump.comment = "Сохранять трассировку стека в debug.log"
  compatibility {
    mod-entity-block-change-events.comment = [
      "Стрелять отменяемым EntityChangeBlockEvent, когда МОДОВАЯ сущность меняет блоки в свой тик"
      "Позволяет плагинам регионов (WorldGuard) защищать приваты от буров/харвестеров Create"
      "Почти бесплатно, если событие никто не слушает. Стационарные машины (block entity) не покрываются"
    ]
    fake-player-block-events.comment = [
      "false освобождает fake-игроков модов (деплойеры Create) от событий BlockBreak/BlockPlace:"
      "машины работают в чужих приватах, но защита регионов на их действия больше не действует"
      "Альтернатива: оставить true и добавить fake-игрока в регион, напр. /rg addmember <регион> [Deployer]"
    ]
    keepalive-lag-grace.comment = [
      "Не выкидывать игроков за то, что тормозил сам сервер"
      "Ответ клиента на keep-alive обрабатывается в главном потоке: пока тот стоит,"
      "пакет лежит в очереди, и ваниль рвёт соединение, хотя со связью игрока всё в порядке"
      "Порог сдвигается ровно на время стойки; мёртвые клиенты всё равно отваливаются"
    ]
    keepalive-timeout-seconds.comment = [
      "Базовый таймаут keep-alive в секундах (ваниль - 15)"
    ]
  }
}
